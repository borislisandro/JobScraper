[package]
name = "jobscraper"
version = "1.0.0"
description = "Local-first job search organizer"
edition = "2021"

[lib]
name = "jobscraper_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: closing the window leaves the app running in the notification area, the way Discord
# and Steam do, so background checks and reminders keep working without a window open.
tauri = { version = "2", features = ["tray-icon"] }
# Living in the tray means the shortcut gets clicked again while the app is already running. Without
# this that starts a second process on the same SQLite file, with a second tray icon; with it, the
# window the user already has comes back.
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
url = "2"
sha2 = "0.10"
zip = "2"
quick-xml = "0.37"
pdf-extract = "0.7"
regex = "1"
futures = "0.3"
base64 = "0.22"
aes-gcm = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# keyring 3 compiles in no credential store unless one is chosen, and without one every Entry is
# an in-memory mock: the session-encryption key would be regenerated on each launch and nothing
# saved earlier could be decrypted. Each platform names its own store.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
windows = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com", "Win32_System_Ole", "Win32_System_TaskScheduler", "Win32_System_Variant"] }

# The Secret Service (GNOME Keyring, KWallet) is where Linux desktops keep per-user secrets.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
